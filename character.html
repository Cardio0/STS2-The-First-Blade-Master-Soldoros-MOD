<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퍼스트 웨펀마스터 솔도로스 — 캐릭터 소개</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#3a3a3c;
  font-family:'Malgun Gothic','맑은 고딕',sans-serif;
  color:#e8e2d6;
  min-height:100vh;
  overflow-x:hidden;
}
.stage{
  position:relative;
  min-height:100vh;
  background:url('char_select_bg.png') no-repeat center center;
  background-size:cover;
  display:flex;
  align-items:center;
}
.stage::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(20,20,22,.55) 0%,rgba(20,20,22,.25) 45%,rgba(20,20,22,0) 70%);
  pointer-events:none;
}
.info-panel{
  position:relative;
  z-index:2;
  margin-left:6vw;
  max-width:560px;
  background:rgba(24,26,28,.88);
  border:1px solid rgba(120,110,90,.35);
  border-radius:14px;
  padding:36px 40px;
  box-shadow:0 10px 40px rgba(0,0,0,.55);
  backdrop-filter:blur(2px);
  clip-path:polygon(3% 0,100% 0,97% 100%,0 100%);
}
.char-title{
  font-size:1.9rem;
  font-weight:bold;
  color:#f0c040;
  letter-spacing:1px;
  margin-bottom:18px;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}
.stats{
  display:flex;
  gap:28px;
  margin-bottom:20px;
  font-size:1.15rem;
  font-weight:bold;
}
.stat-hp{color:#e05050}
.stat-gold{color:#f0c040}
.stat-icon{margin-right:6px}
.char-desc{
  color:#cfc8ba;
  font-size:.98rem;
  line-height:1.75;
  margin-bottom:26px;
}
.relic-box{
  display:flex;
  gap:14px;
  align-items:flex-start;
  border-top:1px solid rgba(120,110,90,.3);
  padding-top:22px;
}
.relic-icon{
  width:44px;height:44px;
  object-fit:contain;
  image-rendering:pixelated;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));
  flex-shrink:0;
}
.relic-name{
  color:#f0c040;
  font-weight:bold;
  font-size:1.05rem;
  margin-bottom:6px;
}
.relic-desc{
  color:#cfc8ba;
  font-size:.92rem;
  line-height:1.65;
}
.gold{color:#f0c040;font-weight:bold}
.back-link{
  position:fixed;
  top:24px;left:24px;
  z-index:5;
  background:rgba(24,26,28,.85);
  border:1px solid rgba(120,110,90,.4);
  color:#e8e2d6;
  text-decoration:none;
  padding:10px 20px;
  border-radius:8px;
  font-size:.9rem;
  transition:background .15s,color .15s;
}
.back-link:hover{background:rgba(240,192,64,.15);color:#f0c040}
@media (max-width:900px){
  .stage{
    align-items:flex-end;
    background-position:70% center;
  }
  .info-panel{
    margin:0 16px 24px;
    max-width:none;
    padding:24px 22px;
    clip-path:none;
  }
  .char-title{font-size:1.4rem}
}
</style>
</head>
<body>
<a class="back-link" href="index.html">← 카드 포트폴리오로</a>
<div class="stage">
  <div class="info-panel">
    <div class="char-title">퍼스트 웨펀마스터 솔도로스</div>
    <div class="stats">
      <span class="stat-hp"><span class="stat-icon">❤</span>77/77</span>
      <span class="stat-gold"><span class="stat-icon">🪙</span>99</span>
    </div>
    <div class="char-desc">
      수천 수만의 무기를 다룰 수 있다고 하는<br>
      전설의 검사이자 웨펀마스터.<br>
      오로지 검술만을 연마하고 강한 자와의 대결에만<br>
      관심을 보였다고 한다.
    </div>
    <div class="relic-box">
      <img class="relic-icon" src="Soldoros/images/relics/egosword_clararis_relic.png" alt="에고소드 클라리스">
      <div>
        <div class="relic-name">에고소드 클라리스</div>
        <div class="relic-desc">매 전투 시작 시, <span class="gold">에고소드 클라리스</span>를<br><span class="gold">손</span>으로 가져옵니다.</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
