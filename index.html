<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>솔도로스 — Soldoros Mod</title>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
  --gold:#e3a838;--gold2:#f0d080;--text:#c9d1d9;--dim:#8b949e;
  --attack:#c94040;--skill:#4080c9;--power:#9040c9;--token:#505060;
  --basic:#888;--common:#c9d1d9;--uncommon:#6ab0ff;--rare:#f0c040;--ancient:#ff6060;
  --starter:#e3a838;--boss:#c940c9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Malgun Gothic','맑은 고딕',sans-serif;min-height:100vh}

/* ── 상단 바 ── */
.topbar{background:#010409;border-bottom:1px solid #1c2128;padding:14px 40px;display:flex;align-items:center;gap:12px}
.topbar-logo{font-size:1.1rem;font-weight:bold;color:var(--gold2);letter-spacing:2px}
.topbar-sub{color:var(--dim);font-size:.8rem}

.page{max-width:1000px;margin:0 auto;padding:32px 20px 80px}

/* ── 캐릭터 프로필 ── */
.char-profile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;display:flex;gap:24px;align-items:center;margin-bottom:28px}
.char-img{width:140px;height:auto;object-fit:contain;image-rendering:pixelated}
.char-info{flex:1}
.char-name{font-size:1.6rem;font-weight:bold;color:var(--gold2);margin-bottom:6px}
.char-desc{color:var(--dim);font-size:.88rem;line-height:1.6;margin-bottom:14px}
.char-stats{display:flex;gap:10px;flex-wrap:wrap}
.stat-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 20px;text-align:center;min-width:90px}
.stat-label{font-size:.7rem;color:var(--dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.stat-val{font-size:1.4rem;font-weight:bold}
.stat-val.hp{color:#c94040}.stat-val.energy{color:var(--gold)}

/* ── 섹션 ── */
.section{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;overflow:visible}
.section-header{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);border-radius:12px 12px 0 0}
.section-title{font-size:1rem;font-weight:bold}
.section-count{color:var(--dim);font-size:.82rem;margin-left:8px}
.section-toggle{color:var(--dim);font-size:.8rem;transition:transform .2s}
.section-toggle.open{transform:rotate(180deg)}
.section-body{padding:20px 24px;border-radius:0 0 12px 12px}
.section-body.hidden{display:none}

/* ── 희귀도 그룹 ── */
.rarity-group{margin-bottom:28px}
.rarity-group:last-child{margin-bottom:0}
.rarity-label{font-size:.72rem;font-weight:bold;letter-spacing:2px;padding:4px 10px;border-radius:4px;display:inline-block;margin-bottom:14px}
.rl-Basic    {background:rgba(136,136,136,.15);color:var(--basic);border:1px solid rgba(136,136,136,.3)}
.rl-Common   {background:rgba(201,209,217,.1);color:var(--common);border:1px solid rgba(201,209,217,.25)}
.rl-Uncommon {background:rgba(106,176,255,.1);color:var(--uncommon);border:1px solid rgba(106,176,255,.25)}
.rl-Rare     {background:rgba(240,192,64,.1);color:var(--rare);border:1px solid rgba(240,192,64,.25)}
.rl-Ancient  {background:rgba(255,96,96,.1);color:var(--ancient);border:1px solid rgba(255,96,96,.25)}
.rl-Token    {background:rgba(80,80,96,.15);color:#9090b0;border:1px solid rgba(80,80,96,.3)}

/* ── 카드 그리드 ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:16px}

/* ══════════════════════════════════
   카드 프레임 (STS2 스타일)
══════════════════════════════════ */
.card-frame{
  position:relative;cursor:pointer;
  border-radius:10px;
  overflow:visible; /* cost-orb·tooltip이 카드 밖으로 나올 수 있도록 */
  transition:transform .18s,box-shadow .18s;
  background:#0c0e12;
  box-shadow:0 4px 14px rgba(0,0,0,.6);
  border:2px solid var(--fc,#444);
}
/* 내부 영역만 라운드 클리핑 */
.card-frame > .card-banner:first-of-type{border-radius:8px 8px 0 0}
.card-desc-area{border-radius:0 0 8px 8px}
.card-frame:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 14px 36px rgba(0,0,0,.7),0 0 20px var(--fc-glow,transparent)}

/* 타입별 색상 변수 */
.card-frame[data-type="Attack"]{
  --fc:#7a1c1c;--fc2:#b83030;--fc-glow:rgba(184,48,48,.25);
  --banner-bg:linear-gradient(180deg,#3a0e0e,#1e0808);
  --desc-bg:linear-gradient(180deg,#180b0b,#120808);
}
.card-frame[data-type="Skill"]{
  --fc:#1c3a7a;--fc2:#3060b8;--fc-glow:rgba(48,96,184,.25);
  --banner-bg:linear-gradient(180deg,#0e1e3a,#081020);
  --desc-bg:linear-gradient(180deg,#0b1220,#080e18);
}
.card-frame[data-type="Power"]{
  --fc:#5a1c7a;--fc2:#8030b8;--fc-glow:rgba(128,48,184,.25);
  --banner-bg:linear-gradient(180deg,#220e3a,#120820);
  --desc-bg:linear-gradient(180deg,#160b20,#0e0818);
}
.card-frame[data-type="Token"]{
  --fc:#3a3a50;--fc2:#5a5a80;--fc-glow:rgba(90,90,128,.15);
  --banner-bg:linear-gradient(180deg,#181820,#101018);
  --desc-bg:linear-gradient(180deg,#111118,#0d0d14);
}

/* 희귀도별 외곽 글로우 */
.card-frame[data-rarity="Rare"]   {box-shadow:0 4px 14px rgba(0,0,0,.6),0 0 12px rgba(240,192,64,.15)}
.card-frame[data-rarity="Rare"]:hover   {box-shadow:0 14px 36px rgba(0,0,0,.7),0 0 24px rgba(240,192,64,.3)}
.card-frame[data-rarity="Ancient"]{box-shadow:0 4px 14px rgba(0,0,0,.6),0 0 12px rgba(255,80,80,.2)}
.card-frame[data-rarity="Ancient"]:hover{box-shadow:0 14px 36px rgba(0,0,0,.7),0 0 28px rgba(255,80,80,.35)}

/* ── 이름 배너 ── */
.card-banner{
  background:var(--banner-bg,linear-gradient(180deg,#2a2a2a,#1a1a1a));
  border-bottom:1px solid var(--fc2,#555);
  padding:6px 32px 5px 32px; /* 좌우 대칭 — 오브 공간만큼 오른쪽도 동일 여백 */
  display:flex;align-items:center;justify-content:center;
  min-height:30px;
  position:relative;
}
.card-banner::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.4),transparent 30%,transparent 70%,rgba(0,0,0,.4));
  pointer-events:none;
}
.card-name{
  font-size:.64rem;font-weight:bold;color:#f0e8d0;
  text-shadow:0 1px 4px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.8);
  text-align:center;letter-spacing:.3px;line-height:1.2;
  position:relative;z-index:1;
}

/* ── 에너지 오브 (솔도로스 에너지 레이어 스택) ── */
.cost-wrap{
  position:absolute;top:-17px;left:-17px;
  width:34px;height:34px;z-index:10;
  display:flex;align-items:center;justify-content:center;
}
.energy-stack{
  position:absolute;inset:0;
}
.energy-stack img{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  object-fit:contain;
}
.cost-num{
  position:relative;z-index:5;
  font-size:.82rem;font-weight:900;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.8);
  line-height:1;
  margin-top:1px;
}

/* ── 카드 일러스트 영역 ── */
.card-art{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  background:#08080c;
}
.card-art img{
  width:100%;height:100%;
  object-fit:cover;display:block;
}
/* 일러스트 하단 페이드 */
.card-art::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:28px;
  background:linear-gradient(0deg,var(--fc,#111) 0%,transparent 100%);
  opacity:.6;pointer-events:none;
}
/* 타입 배지 */
.card-type-badge{
  position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
  font-size:.58rem;padding:2px 8px;border-radius:2px;font-weight:bold;
  background:rgba(0,0,0,.82);border:1px solid rgba(255,255,255,.12);
  color:#d0ccc0;letter-spacing:.5px;white-space:nowrap;z-index:2;
}

/* ── 설명 영역 ── */
.card-desc-area{
  background:var(--desc-bg,linear-gradient(180deg,#141414,#0e0e0e));
  border-top:1px solid var(--fc2,#444);
  padding:7px 8px 9px;
  font-size:.6rem;line-height:1.55;color:#c0b8a8;
  min-height:54px;
  position:relative;
  text-align:center;
}
.card-desc-area .kw{color:var(--gold);font-weight:bold}
.card-desc-area .blue{color:#80b0ff}

/* 카드 하단 내부 장식선 */
.card-frame::after{
  content:'';position:absolute;
  bottom:0;left:2px;right:2px;height:2px;
  background:linear-gradient(90deg,transparent,var(--fc2,#555),transparent);
  border-radius:0 0 8px 8px;
  opacity:.6;
}

/* ── 키워드 툴팁 ── */
.kw{color:var(--gold);font-weight:bold;cursor:default;position:relative}
.kw[data-tip]{cursor:help;border-bottom:1px dotted rgba(227,168,56,.5)}
.kw[data-tip]:hover .kw-popup{display:block}
.kw-popup{
  display:none;position:absolute;bottom:calc(100% + 6px);left:50%;
  transform:translateX(-50%);z-index:999;
  background:#1c2128;border:1px solid #e3a838;border-radius:6px;
  padding:8px 10px;min-width:180px;max-width:240px;
  font-size:.72rem;line-height:1.5;color:#c9d1d9;font-weight:normal;
  white-space:normal;pointer-events:none;
  box-shadow:0 4px 16px rgba(0,0,0,.8);
}
.kw-popup::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:#e3a838;
}
.kw-popup-name{color:#e3a838;font-weight:bold;font-size:.75rem;margin-bottom:4px;display:block}
/* 강화 하이라이트 */
.upg{color:#5cdd5c;font-weight:bold}
/* 강화 토글 버튼 */
.upg-row{display:flex;justify-content:center;margin:12px 0 4px}
.upg-btn{
  background:transparent;border:1px solid var(--border);border-radius:6px;
  color:var(--dim);font-size:.78rem;padding:4px 18px;cursor:pointer;
  transition:all .15s;
}
.upg-btn:hover{border-color:var(--gold);color:var(--gold)}
.upg-btn.active{background:#2a3a0e;border-color:#5cdd5c;color:#5cdd5c;font-weight:bold}

/* ── 유물 ── */
.relic-list{display:flex;flex-direction:column;gap:2px}
.relic-row{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:8px;cursor:pointer;transition:background .15s;border:1px solid transparent}
.relic-row:hover{background:var(--surface2);border-color:var(--border)}
.relic-icon{width:52px;height:52px;object-fit:contain;image-rendering:pixelated;flex-shrink:0}
.relic-main{flex:1;min-width:0}
.relic-name-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.relic-name{font-size:.9rem;font-weight:bold}
.tier-badge{font-size:.65rem;padding:2px 7px;border-radius:3px;font-weight:bold}
.tb-Starter {background:rgba(227,168,56,.2);color:var(--gold);border:1px solid rgba(227,168,56,.4)}
.tb-Boss    {background:rgba(201,64,201,.2);color:#e080e0;border:1px solid rgba(201,64,201,.4)}
.tb-Common  {background:rgba(201,209,217,.1);color:var(--common);border:1px solid rgba(201,209,217,.25)}
.tb-Uncommon{background:rgba(106,176,255,.1);color:var(--uncommon);border:1px solid rgba(106,176,255,.25)}
.tb-Rare    {background:rgba(240,192,64,.1);color:var(--rare);border:1px solid rgba(240,192,64,.25)}
.tb-Ancient {background:rgba(255,96,96,.1);color:var(--ancient);border:1px solid rgba(255,96,96,.3)}
.relic-desc{font-size:.78rem;color:var(--dim);line-height:1.5}
.relic-desc .kw{color:var(--gold)}

/* ── 포션 ── */
.potion-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.potion-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:border-color .15s,transform .15s}
.potion-row:hover{border-color:var(--gold);transform:translateY(-1px)}
.potion-icon{width:52px;height:52px;object-fit:contain;image-rendering:pixelated}
.potion-name{font-size:.88rem;font-weight:bold;margin-bottom:4px}
.potion-desc{font-size:.75rem;color:var(--dim);line-height:1.4}
.potion-desc .kw{color:var(--gold)}

/* ── NPC 대사 ── */
.npc-accordion{display:flex;flex-direction:column;gap:4px}
.npc-item{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.npc-header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:var(--surface2);transition:background .15s}
.npc-header:hover{background:#2a2f36}
.npc-header-name{font-size:.9rem;font-weight:bold}
.npc-conv-count{font-size:.75rem;color:var(--dim)}
.npc-toggle{color:var(--dim);transition:transform .2s}
.npc-toggle.open{transform:rotate(180deg)}
.npc-body{display:none;padding:16px;background:var(--surface);border-top:1px solid var(--border)}
.npc-body.open{display:block}
.conv-block{margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:16px}
.conv-block:last-child{margin-bottom:0;border-bottom:none;padding-bottom:0}
.conv-num{font-size:.68rem;color:var(--dim);margin-bottom:8px;letter-spacing:1px}
.chat-bubble{margin-bottom:8px;max-width:85%}
.chat-bubble.ancient{margin-right:auto}
.chat-bubble.char{margin-left:auto}
.bubble-speaker{font-size:.65rem;font-weight:bold;margin-bottom:3px;letter-spacing:.5px}
.chat-bubble.ancient .bubble-speaker{color:var(--dim)}
.chat-bubble.char .bubble-speaker{color:var(--gold);text-align:right}
.bubble-text{padding:8px 12px;border-radius:8px;font-size:.82rem;line-height:1.5}
.chat-bubble.ancient .bubble-text{background:var(--surface2);border:1px solid var(--border);border-radius:0 8px 8px 8px;color:var(--text)}
.chat-bubble.char .bubble-text{background:rgba(201,162,39,.15);border:1px solid rgba(201,162,39,.3);border-radius:8px 0 8px 8px;color:#e8dcc0;text-align:right}

/* ── 모달 ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--dim);font-size:1.3rem;cursor:pointer;z-index:1}
.modal-close:hover{color:var(--text)}

/* 카드 모달 */
.cmodal-top{padding:28px 28px 0}
.cmodal-card-wrap{display:flex;justify-content:center;margin-bottom:24px}
.cmodal-card{
  width:200px;border-radius:10px;overflow:visible;
  border:3px solid var(--fc,#444);position:relative;background:#0a0c10;
  box-shadow:0 8px 24px rgba(0,0,0,.7);
}
/* cost-orb·tooltip이 카드 테두리 밖으로 나오도록 내부 요소에 모서리 처리 */
.cmodal-card > .card-banner:first-of-type{border-radius:7px 7px 0 0}
.cmodal-card > .card-desc-area{border-radius:0 0 7px 7px}
.cmodal-card[data-type="Attack"]{--fc:#7a1c1c;--fc2:#b83030;--banner-bg:linear-gradient(180deg,#3a0e0e,#1e0808);--desc-bg:linear-gradient(180deg,#180b0b,#120808)}
.cmodal-card[data-type="Skill"]  {--fc:#1c3a7a;--fc2:#3060b8;--banner-bg:linear-gradient(180deg,#0e1e3a,#081020);--desc-bg:linear-gradient(180deg,#0b1220,#080e18)}
.cmodal-card[data-type="Power"]  {--fc:#5a1c7a;--fc2:#8030b8;--banner-bg:linear-gradient(180deg,#220e3a,#120820);--desc-bg:linear-gradient(180deg,#160b20,#0e0818)}
.cmodal-card[data-type="Token"]  {--fc:#3a3a50;--fc2:#5a5a80;--banner-bg:linear-gradient(180deg,#181820,#101018);--desc-bg:linear-gradient(180deg,#111118,#0d0d14)}
.cmodal-card .cost-wrap{width:42px;height:42px;top:-21px;left:-21px}
.cmodal-card .cost-num{font-size:1rem}
.cmodal-card .card-name{font-size:.62rem;padding:6px 4px 5px 4px}
.cmodal-card .card-desc-area{font-size:.7rem;min-height:70px;padding:10px;text-align:center}
.cmodal-info{padding:0 28px 28px}
.cmodal-name{font-size:1.2rem;font-weight:bold;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.cmodal-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;font-size:.78rem;color:var(--dim)}
.cmodal-meta-item{display:flex;align-items:center;gap:4px}
.meta-dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.cmodal-desc-label{font-size:.72rem;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.cmodal-desc{font-size:.88rem;line-height:1.7;white-space:pre-line}
.cmodal-desc .kw{color:var(--gold)}

/* 유물/포션 모달 */
.imodal-body{padding:32px;text-align:center}
.imodal-icon{width:90px;height:90px;object-fit:contain;image-rendering:pixelated;margin-bottom:16px}
.imodal-name{font-size:1.2rem;font-weight:bold;margin-bottom:8px}
.imodal-meta{color:var(--dim);font-size:.8rem;margin-bottom:20px}
.imodal-desc{font-size:.88rem;line-height:1.8;white-space:pre-line;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.imodal-desc .kw{color:var(--gold)}
.imodal-flavor{font-size:.78rem;color:var(--dim);font-style:italic;line-height:1.6}

@media(max-width:600px){
  .char-profile{flex-direction:column;text-align:center}
  .char-img{width:100px}
  .page{padding:16px 12px 60px}
  .section-body{padding:14px}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .cmodal-card{width:160px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">⚔ Soldoros Mod</div>
  <div class="topbar-sub">Slay the Spire 2 · 커스텀 캐릭터</div>
</div>

<div class="page">

  <!-- 캐릭터 프로필 -->
  <div class="char-profile">
    <img class="char-img" src="char.png" alt="솔도로스">
    <div class="char-info">
      <div class="char-name">퍼스트 웨펀마스터 솔도로스</div>
      <div class="char-desc">수천 수만의 무기를 다룰 수 있다고 하는 전설의 검사이자 웨펀마스터.<br>오로지 검술만을 연마하고 강한 자와의 대결에만 관심을 보였다고 한다.</div>
      <div class="char-stats">
        <div class="stat-box"><div class="stat-label">체력</div><div class="stat-val hp">77</div></div>
        <div class="stat-box"><div class="stat-label">에너지</div><div class="stat-val energy">3</div></div>
        <div class="stat-box"><div class="stat-label">카드</div><div class="stat-val" style="color:var(--uncommon)">57</div></div>
        <div class="stat-box"><div class="stat-label">유물</div><div class="stat-val" style="color:var(--rare)">9</div></div>
      </div>
    </div>
  </div>

  <!-- 시작 덱 -->
  <div class="section">
    <div class="section-header" onclick="toggleSection(this)">
      <div><span class="section-title">시작 덱</span><span class="section-count">(10장)</span></div>
      <span class="section-toggle open">▲</span>
    </div>
    <div class="section-body" id="starting-grid-wrap">
      <div class="card-grid" id="starting-grid"></div>
    </div>
  </div>

  <!-- 모든 카드 -->

const START          = ["strike_soldoros", "strike_soldoros", "strike_soldoros", "strike_soldoros", "defend_soldoros", "defend_soldoros", "defend_soldoros", "defend_soldoros", "ashe_fork", "upward_slash"];

const RARITY_KOR = {Basic:'기본',Common:'일반',Uncommon:'고급',Rare:'희귀',Ancient:'고대',Token:'토큰',Starter:'스타터',Boss:'보스'};
const RARITY_ORDER = ['Basic','Common','Uncommon','Rare','Ancient','Token'];

/* 키워드 → 툴팁 설명 */

  '에고소드 클라리스': { name:'에고소드 클라리스', desc:'솔도로스의 자아검. 뽑을 카드 더미에서 손으로 이동할 때마다 모든 적에게 피해를 줍니다.' },

  '휘발성':      { name:'휘발성 (Ethereal)', desc:'이 카드는 이번 턴 종료 시 손에 있다면, 소멸합니다.' },
  '소멸':        { name:'소멸 (Exhaust)', desc:'전투가 끝날 때까지 제거됩니다.' },
};

function renderDesc(raw) {
  if(!raw) return '';
  const html = raw
    .replace(/\[upg\](.*?)\[\/upg\]/g,'<span class="upg">$1</span>')
    .replace(/\[gold\](.*?)\[\/gold\]/gs, (_, inner) => {
      const plainInner = inner.replace(/<[^>]+>/g,'');
      const tip = KEYWORD_TIPS[plainInner] || KEYWORD_TIPS[inner];
      if(tip) {
        return `<span class="kw" data-tip="1"><span class="kw-popup"><span class="kw-popup-name">${tip.name}</span>${tip.desc}</span>${inner}</span>`;
      }
      return `<span class="kw">${inner}</span>`;
    })
    .replace(/\[blue\](.*?)\[\/blue\]/g,'<span class="blue">$1</span>')
    .replace(/\n/g,'<br>');
  return html;
}

function makeEnergyStack() {
  return ENERGY_LAYERS.map(src =>
    `<img src="${src}" alt="" onerror="this.style.display='none'">`
  ).join('');
}

function makeCardHTML(c) {
  const costLabel = c.cost === -1 ? 'X' : c.cost;
  return `<div class="card-frame" data-type="${c.type}" data-rarity="${c.rarity}"
      onclick="openCardModal('${c.key}')">
    <div class="cost-wrap">
      <div class="energy-stack">${makeEnergyStack()}</div>
      <span class="cost-num">${costLabel}</span>
    </div>
    <div class="card-banner">
      <span class="card-name">${c.name}</span>
    </div>
    <div class="card-art">
      <img src="${c.img}" alt="${c.name}" loading="lazy" onerror="this.style.opacity='.1'">
      <div class="card-type-badge">${TYPE_KOR[c.type]}</div>
    </div>
    <div class="card-desc-area">${renderDesc(c.desc)}</div>
  </div>`;
}

function renderStartingDeck() {
  const grid = document.getElementById('starting-grid');
  grid.innerHTML = START.map(key => {
    const c = CARDS.find(x=>x.key===key);
    return c ? makeCardHTML(c) : '';
  }).join('');
}

function renderAllCards() {
  const body = document.getElementById('all-cards-body');
  document.getElementById('all-card-count').textContent = `(${CARDS.length}장)`;
  let html = '';
  for(const rarity of RARITY_ORDER) {
    const group = CARDS.filter(c=>c.rarity===rarity);
    if(!group.length) continue;
    html += `<div class="rarity-group">
      <div class="rarity-label rl-${rarity}">${RARITY_KOR[rarity].toUpperCase()} (${group.length})</div>
      <div class="card-grid">${group.map(c=>makeCardHTML(c)).join('')}</div>
    </div>`;
  }
  body.innerHTML = html;
}

function renderRelics() {
  const TIER_KOR = {Starter:'스타터',Boss:'보스',Common:'일반',Uncommon:'고급',Rare:'희귀',Ancient:'고대의 존재'};
  document.getElementById('relic-list').innerHTML = RELICS.map(r => `
    <div class="relic-row" onclick="openItemModal('relic','${r.key}')">
      <img class="relic-icon" src="${r.img}" alt="${r.name}" onerror="this.style.opacity='.15'">
      <div class="relic-main">
        <div class="relic-name-row">
          <span class="relic-name">${r.name}</span>
          <span class="tier-badge tb-${r.tier}">${TIER_KOR[r.tier]||r.tier} 유물</span>
        </div>
        <div class="relic-desc">${renderDesc(r.desc)}</div>
      </div>
    </div>`).join('');
}

function renderPotions() {
  const RARITY_COLOR = {Common:'var(--common)',Uncommon:'var(--uncommon)',Rare:'var(--rare)'};
  document.getElementById('potion-grid').innerHTML = POTIONS.map(p => `
    <div class="potion-row" onclick="openItemModal('potion','${p.key}')">
      <img class="potion-icon" src="${p.img}" alt="${p.name}" onerror="this.style.opacity='.15'">
      <div>
        <div class="potion-name">${p.name} <span style="font-size:.7rem;color:${RARITY_COLOR[p.rarity]||'var(--dim)'};font-weight:normal">${RARITY_KOR[p.rarity]}</span></div>
        <div class="potion-desc">${renderDesc(p.desc)}</div>
      </div>
    </div>`).join('');
}

function renderDialogues() {
  document.getElementById('npc-list').innerHTML = DIALOGUES.map(d => `
    <div class="npc-item">
      <div class="npc-header" onclick="toggleNpc(this)">
        <span class="npc-header-name">${d.npc}</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span class="npc-conv-count">${d.conversations.length}개 대화</span>
          <span class="npc-toggle">▼</span>
        </span>
      </div>
      <div class="npc-body">
        ${d.conversations.map((conv,ci) => `
          <div class="conv-block">
            <div class="conv-num">대화 ${ci+1}</div>
            ${conv.map(line => `
              <div class="chat-bubble ${line.role}">
                <div class="bubble-speaker">${line.speaker.toUpperCase()}</div>
                <div class="bubble-text">${line.text}</div>
              </div>`).join('')}
          </div>`).join('')}
      </div>
    </div>`).join('');
}

function toggleSection(header) {
  const body = header.nextElementSibling;
  const toggle = header.querySelector('.section-toggle');
  if(body.classList.contains('hidden')) {
    body.classList.remove('hidden'); toggle.classList.add('open'); toggle.textContent='▲';
  } else {
    body.classList.add('hidden'); toggle.classList.remove('open'); toggle.textContent='▼';
  }
}

function toggleNpc(header) {
  const body = header.nextElementSibling;
  const toggle = header.querySelector('.npc-toggle');
  body.classList.toggle('open');
  toggle.classList.toggle('open');
}

let _currentCardKey = null;
let _upgraded = false;

function _applyCardModal(c, upgraded) {
  const upg = CARD_UPGRADES[c.key];
  const hasUpg = !!upg;
  const desc  = (upgraded && upg && upg.desc !== null) ? upg.desc : c.desc;
  const cost  = (upgraded && upg && upg.cost !== null && upg.cost !== undefined) ? upg.cost : c.cost;
  const name  = upgraded ? c.name + '+' : c.name;

  const frame = document.getElementById('cm-card-frame');
  frame.dataset.type = c.type;
  document.getElementById('cm-energy-stack').innerHTML = makeEnergyStack();
  const costEl = document.getElementById('cm-cost-num');
  costEl.textContent = cost === -1 ? 'X' : cost;
  const costChanged = upgraded && upg && upg.cost !== null && upg.cost !== undefined && upg.cost !== c.cost;
  costEl.style.color = costChanged ? '#5cdd5c' : '';
  const titleEl = document.getElementById('cm-title');
  titleEl.textContent = name;
  titleEl.style.color = upgraded ? '#5cdd5c' : '';
  document.getElementById('cm-img').src = c.img;
  document.getElementById('cm-type-badge').textContent = TYPE_KOR[c.type];
  document.getElementById('cm-desc-card').innerHTML = renderDesc(desc);
  const nameEl = document.getElementById('cm-name');
  nameEl.textContent = upgraded ? c.name + '+' : c.name;
  nameEl.style.color = upgraded ? '#5cdd5c' : '';
  document.getElementById('cm-meta').innerHTML =
    `<span class="cmodal-meta-item"><span class="meta-dot" style="background:var(--${c.type.toLowerCase()})"></span>${TYPE_KOR[c.type]}</span>` +
    `<span class="cmodal-meta-item">·</span>` +
    `<span class="cmodal-meta-item">${RARITY_KOR[c.rarity]}</span>` +
    `<span class="cmodal-meta-item">·</span>` +
    `<span class="cmodal-meta-item">솔도로스</span>`;
  document.getElementById('cm-desc-text').innerHTML = renderDesc(desc);

  const btn = document.getElementById('cm-upg-btn');
  btn.style.display = hasUpg ? '' : 'none';
  btn.classList.toggle('active', upgraded);
}

function openCardModal(key) {
  const c = CARDS.find(x=>x.key===key);
  if(!c) return;
  _currentCardKey = key;
  _upgraded = false;
  _applyCardModal(c, false);
  document.getElementById('card-modal').classList.add('open');
}

function toggleUpgrade() {
  const c = CARDS.find(x=>x.key===_currentCardKey);
  if(!c) return;
  _upgraded = !_upgraded;
  _applyCardModal(c, _upgraded);
}

function openItemModal(type, key) {
  const items = type==='relic' ? RELICS : POTIONS;
  const item = items.find(x=>x.key===key);
  if(!item) return;
  const TIER_KOR = {Starter:'스타터',Boss:'보스',Common:'일반',Uncommon:'고급',Rare:'희귀',Ancient:'고대의 존재'};
  document.getElementById('im-icon').src = item.img;
  document.getElementById('im-name').textContent = item.name;
  const meta = type==='relic'
    ? `${TIER_KOR[item.tier]||item.tier} 유물 · 솔도로스`
    : `${RARITY_KOR[item.rarity]} 포션 · 솔도로스`;
  document.getElementById('im-meta').textContent = meta;
  document.getElementById('im-desc').innerHTML = renderDesc(item.desc);
  const flavorEl = document.getElementById('im-flavor');
  flavorEl.textContent = item.flavor || '';
  flavorEl.style.display = item.flavor ? '' : 'none';
  document.getElementById('item-modal').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open') }
function closeModalBg(e,id) { if(e.target===document.getElementById(id)) closeModal(id) }

renderStartingDeck();
renderAllCards();
renderRelics();
renderPotions();
renderDialogues();
